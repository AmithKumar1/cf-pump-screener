name = "cf-pump-screener"
main = "src/index.ts"
compatibility_date = "2026-08-27"

# 100% Cloudflare Free Tier Worker
# Runs HTTP Webhook receiver + Cron Trigger every 1 minute

[triggers]
crons = ["* * * * *"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "pump_launches"
database_id = "42fa42b0-db96-4dd8-877b-dcde17bbef60"

# Public configuration variables
[vars]
MIN_ALERT_SCORE = "75"
PAUSE_TELEGRAM_ALERTS = "true"

# Secrets must be configured exclusively via `npx wrangler secret put <NAME>`:
# - WEBHOOK_SECRET (high-entropy key for webhook & alert authentication)
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
